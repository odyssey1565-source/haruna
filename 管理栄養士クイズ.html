<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理栄養士 国家試験 対策クイズ</title>
  <!-- Google Fontsの読み込み（Noto Sans JP：日本語フォント） -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <style>
    /* =====================================================
       グローバルリセットと基本スタイル
       =====================================================*/
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ページ全体の背景グラデーション（紫→青のグラデーション） */
    body {
      font-family: 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px;
      overflow-x: hidden;
    }

    /* =====================================================
       アプリ全体のコンテナ
       =====================================================*/
    #app {
      width: 100%;
      max-width: 760px;
      position: relative;
    }

    /* =====================================================
       ヘッダーエリア（タイトルと統計情報）
       =====================================================*/
    .header {
      text-align: center;
      margin-bottom: 24px;
      color: white;
    }

    .header h1 {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 900;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.9rem;
      opacity: 0.85;
      font-weight: 300;
    }

    /* =====================================================
       スコアバー（問題番号・スコア・連続正解）
       =====================================================*/
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 10px 20px;
      margin-bottom: 14px;
      color: white;
      font-size: 0.88rem;
      font-weight: 500;
    }

    .stats-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .stats-label {
      font-size: 0.7rem;
      opacity: 0.8;
      font-weight: 300;
    }

    .stats-value {
      font-size: 1.1rem;
      font-weight: 700;
    }

    /* 連続正解カウンターのハイライト（3連続以上で光る） */
    .streak-highlight {
      color: #ffd700;
      animation: streakPulse 0.6s ease-out;
    }

    @keyframes streakPulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    /* =====================================================
       プログレスバー（上部の進捗表示）
       =====================================================*/
    .progress-container {
      background: rgba(255,255,255,0.2);
      border-radius: 99px;
      height: 8px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      border-radius: 99px;
      /* 正解→緑、不正解→赤のグラデーションで進捗を表示 */
      background: linear-gradient(90deg, #43e97b, #38f9d7);
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 10px rgba(67,233,123,0.5);
    }

    /* =====================================================
       問題カード（白い丸角のカード）
       =====================================================*/
    .question-card {
      background: white;
      border-radius: 24px;
      padding: 32px;
      box-shadow:
        0 20px 60px rgba(0,0,0,0.15),
        0 4px 16px rgba(0,0,0,0.08);
      animation: cardIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }

    /* カード表示アニメーション（下から滑らかに登場） */
    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* カードの左上の装飾アクセント */
    .question-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, #667eea, #764ba2);
    }

    /* =====================================================
       カテゴリバッジ（各カテゴリを色分けして表示）
       =====================================================*/
    .category-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: 0.05em;
    }

    /* カテゴリ別の色定義 */
    .cat-基礎栄養学     { background: #fff0f3; color: #e63980; border: 1.5px solid #e63980; }
    .cat-応用栄養学     { background: #fff4e6; color: #e67700; border: 1.5px solid #e67700; }
    .cat-臨床栄養学     { background: #f0fff4; color: #2f9e44; border: 1.5px solid #2f9e44; }
    .cat-食べ物と健康   { background: #fff9db; color: #e67700; border: 1.5px solid #f59f00; }
    .cat-人体の構造と機能 { background: #f3f0ff; color: #7048e8; border: 1.5px solid #7048e8; }
    .cat-公衆栄養学     { background: #e7f5ff; color: #1971c2; border: 1.5px solid #1971c2; }
    .cat-栄養教育論     { background: #fff0fb; color: #c2255c; border: 1.5px solid #c2255c; }
    .cat-給食経営管理論 { background: #e6fcf5; color: #099268; border: 1.5px solid #099268; }
    .cat-社会・環境と健康{ background: #e8f4fd; color: #0c6ef2; border: 1.5px solid #0c6ef2; }
    .cat-食品衛生学     { background: #fff3e0; color: #d84315; border: 1.5px solid #d84315; }

    /* =====================================================
       問題番号と問題文
       =====================================================*/
    .question-number {
      font-size: 0.78rem;
      color: #aaa;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .question-text {
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      font-weight: 700;
      color: #1a1a2e;
      line-height: 1.7;
      margin-bottom: 24px;
    }

    /* =====================================================
       選択肢ボタン
       =====================================================*/
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border: 2px solid #e8e8f0;
      border-radius: 14px;
      background: #f8f8fc;
      cursor: pointer;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 0.95rem;
      color: #2d2d44;
      font-weight: 500;
      text-align: left;
      transition:
        transform 0.15s ease,
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
      line-height: 1.5;
    }

    /* ホバー時のエフェクト（未回答時のみ） */
    .option-btn:hover:not(:disabled) {
      transform: translateX(4px);
      border-color: #667eea;
      background: #f0f0ff;
      box-shadow: 0 4px 12px rgba(102,126,234,0.15);
    }

    /* 選択肢の頭文字バッジ（A, B, C, D） */
    .option-letter {
      min-width: 30px;
      height: 30px;
      border-radius: 8px;
      background: #e8e8f0;
      color: #555;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      transition: background 0.2s, color 0.2s;
    }

    /* 正解の選択肢（緑ハイライト） */
    .option-btn.correct {
      border-color: #2f9e44;
      background: linear-gradient(135deg, #f0fff4, #dcffe8);
      color: #1a5c2a;
      animation: correctBounce 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .option-btn.correct .option-letter {
      background: #2f9e44;
      color: white;
    }

    /* 不正解の選択肢（赤ハイライト） */
    .option-btn.wrong {
      border-color: #e03131;
      background: linear-gradient(135deg, #fff5f5, #ffe8e8);
      color: #7d1a1a;
      animation: wrongShake 0.4s ease;
    }

    .option-btn.wrong .option-letter {
      background: #e03131;
      color: white;
    }

    /* 正解アニメーション（バウンス） */
    @keyframes correctBounce {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    /* 不正解アニメーション（左右に振れる） */
    @keyframes wrongShake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-6px); }
      40%       { transform: translateX(6px); }
      60%       { transform: translateX(-4px); }
      80%       { transform: translateX(4px); }
    }

    /* 回答後はボタンを無効化 */
    .option-btn:disabled {
      cursor: default;
    }

    /* =====================================================
       解説エリア（回答後に表示）
       =====================================================*/
    .explanation-box {
      margin-top: 20px;
      padding: 16px 20px;
      border-radius: 14px;
      font-size: 0.88rem;
      line-height: 1.75;
      color: #2d2d44;
      animation: fadeIn 0.4s ease;
      display: none; /* 初期非表示、回答後に表示 */
    }

    .explanation-box.correct-exp {
      background: linear-gradient(135deg, #f0fff4, #e6fef0);
      border-left: 4px solid #2f9e44;
    }

    .explanation-box.wrong-exp {
      background: linear-gradient(135deg, #fff5f5, #fff0f0);
      border-left: 4px solid #e03131;
    }

    .explanation-title {
      font-weight: 700;
      font-size: 0.82rem;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .exp-icon {
      font-size: 1rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* =====================================================
       次の問題ボタン
       =====================================================*/
    .next-btn {
      margin-top: 20px;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s;
      box-shadow: 0 6px 20px rgba(102,126,234,0.35);
      display: none; /* 初期非表示、回答後に表示 */
    }

    .next-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(102,126,234,0.45);
    }

    .next-btn:active {
      transform: translateY(0);
    }

    /* =====================================================
       連続正解ポップアップ（フラッシュ表示）
       =====================================================*/
    .streak-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: linear-gradient(135deg, #ffd700, #ff9500);
      color: white;
      padding: 18px 36px;
      border-radius: 20px;
      font-size: 1.4rem;
      font-weight: 900;
      text-align: center;
      z-index: 9999;
      box-shadow: 0 10px 40px rgba(255,165,0,0.4);
      pointer-events: none;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
    }

    .streak-popup.show {
      transform: translate(-50%, -50%) scale(1);
    }

    .streak-popup.hide {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.8);
    }

    /* =====================================================
       結果画面
       =====================================================*/
    .result-screen {
      background: white;
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      box-shadow:
        0 20px 60px rgba(0,0,0,0.15),
        0 4px 16px rgba(0,0,0,0.08);
      animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: none;
      position: relative;
      overflow: hidden;
    }

    .result-screen::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, #667eea, #764ba2);
    }

    .result-emoji {
      font-size: 4rem;
      margin-bottom: 16px;
      animation: emojiBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
    }

    @keyframes emojiBounce {
      from { transform: scale(0) rotate(-10deg); }
      to   { transform: scale(1) rotate(0); }
    }

    .result-title {
      font-size: 1.6rem;
      font-weight: 900;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    .result-subtitle {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    /* 得点の大きな表示 */
    .score-display {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 4px;
      margin-bottom: 10px;
    }

    .score-number {
      font-size: 4rem;
      font-weight: 900;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }

    .score-total {
      font-size: 1.2rem;
      color: #aaa;
      font-weight: 500;
    }

    /* 星表示（スコアに応じて1〜5星） */
    .stars-container {
      font-size: 2rem;
      margin: 16px 0;
      letter-spacing: 4px;
    }

    .star {
      display: inline-block;
      transition: transform 0.2s ease;
      animation: starPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .star:nth-child(1) { animation-delay: 0.4s; }
    .star:nth-child(2) { animation-delay: 0.5s; }
    .star:nth-child(3) { animation-delay: 0.6s; }
    .star:nth-child(4) { animation-delay: 0.7s; }
    .star:nth-child(5) { animation-delay: 0.8s; }

    @keyframes starPop {
      from { transform: scale(0) rotate(-20deg); opacity: 0; }
      to   { transform: scale(1) rotate(0);      opacity: 1; }
    }

    /* カテゴリ別正解率の内訳 */
    .category-breakdown {
      margin: 20px 0;
      text-align: left;
    }

    .breakdown-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #555;
      margin-bottom: 12px;
      text-align: center;
    }

    .breakdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .breakdown-cat {
      font-size: 0.72rem;
      white-space: nowrap;
      color: #555;
      width: 110px;
      flex-shrink: 0;
    }

    .breakdown-bar-bg {
      flex: 1;
      height: 8px;
      border-radius: 99px;
      background: #eee;
      overflow: hidden;
    }

    .breakdown-bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      transition: width 1s cubic-bezier(0.4,0,0.2,1);
    }

    .breakdown-pct {
      font-size: 0.75rem;
      font-weight: 700;
      color: #667eea;
      width: 36px;
      text-align: right;
    }

    /* 結果画面のボタンエリア */
    .result-btn-area {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      margin-top: 24px;
    }

    /* もう一度ボタン */
    .retry-btn {
      padding: 16px 40px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.06em;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 6px 20px rgba(102,126,234,0.35);
      width: 100%;
      max-width: 320px;
    }

    .retry-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(102,126,234,0.45);
    }

    /* 年度選択に戻るボタン（結果画面用） */
    .back-to-year-btn {
      padding: 12px 32px;
      border: 2px solid #667eea;
      border-radius: 14px;
      background: transparent;
      color: #667eea;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: transform 0.15s ease, background 0.2s ease, color 0.2s ease;
      width: 100%;
      max-width: 320px;
    }

    .back-to-year-btn:hover {
      background: #667eea;
      color: white;
      transform: translateY(-2px);
    }

    /* =====================================================
       紙吹雪（コンフェッティ）アニメーション
       高得点（80%以上）で表示される祝福エフェクト
       =====================================================*/
    .confetti-wrapper {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 9998;
      overflow: hidden;
    }

    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      top: -20px;
      animation: confettiFall linear both;
    }

    /* 紙吹雪の落下アニメーション（ランダムな回転と揺れ） */
    @keyframes confettiFall {
      0% {
        transform: translateY(-20px) rotateZ(0deg) rotateX(0deg);
        opacity: 1;
      }
      80% {
        opacity: 1;
      }
      100% {
        transform: translateY(110vh) rotateZ(720deg) rotateX(360deg);
        opacity: 0;
      }
    }

    /* =====================================================
       年度選択画面（新規追加）
       =====================================================*/
    #year-select-screen {
      background: white;
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      box-shadow:
        0 20px 60px rgba(0,0,0,0.15),
        0 4px 16px rgba(0,0,0,0.08);
      animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }

    /* 年度選択画面の上部アクセントライン */
    #year-select-screen::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, #667eea, #764ba2);
    }

    /* 年度選択画面のロゴアイコン */
    .year-select-logo {
      font-size: 3.5rem;
      margin-bottom: 16px;
    }

    /* 年度選択画面のタイトル */
    .year-select-title {
      font-size: 1.5rem;
      font-weight: 900;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    /* 年度選択画面のサブタイトル */
    .year-select-subtitle {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    /* 年度選択の案内テキスト */
    .year-select-label {
      font-size: 1rem;
      font-weight: 700;
      color: #444;
      margin-bottom: 16px;
    }

    /* 年度ボタンを格子状に並べるグリッド */
    .year-btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    /* 年度ボタン（第35回〜第39回） */
    .year-btn {
      padding: 18px 12px;
      border: 2px solid #e8e8f0;
      border-radius: 16px;
      background: #f8f8fc;
      cursor: pointer;
      font-family: 'Noto Sans JP', sans-serif;
      text-align: center;
      transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .year-btn:hover {
      transform: translateY(-3px);
      border-color: #667eea;
      background: #f0f0ff;
      box-shadow: 0 8px 20px rgba(102,126,234,0.2);
    }

    /* 年度ボタンの回数テキスト（大きめ） */
    .year-btn-round {
      font-size: 1.1rem;
      font-weight: 900;
      color: #1a1a2e;
      display: block;
      margin-bottom: 2px;
    }

    /* 年度ボタンの西暦テキスト（小さめ） */
    .year-btn-year {
      font-size: 0.8rem;
      color: #888;
      display: block;
    }

    /* 第39回ボタンは中央に配置するため専用のコンテナで包む */
    .year-btn-center-row {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }

    /* 中央配置ボタンのサイズ調整 */
    .year-btn-center-row .year-btn {
      width: calc(50% - 6px);
    }

    /* 全年度ランダム出題ボタン（横幅いっぱい） */
    .year-btn-all {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: transform 0.15s ease, box-shadow 0.2s ease;

// =====================================================
// アプリの状態管理（ゲームの進行状況を管理する変数）
// =====================================================
let currentIndex = 0;    // 現在の問題番号（0始まり）
let score = 0;           // 正解数
let streak = 0;          // 連続正解数
let answered = false;    // 現在の問題に回答済みかどうか
let selectedYear = 0;    // 選択した年度（0=全年度）

// カテゴリ別の正解・出題数を記録するオブジェクト
let categoryStats = {};

// 実際に出題する問題（年度でフィルタ後にシャッフルしたもの）
let shuffledQuestions = [];

// =====================================================
// 配列をランダムにシャッフルする関数（Fisher-Yates法）
// =====================================================
function shuffleArray(array) {
  const arr = [...array]; // 元の配列をコピー（破壊しない）
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]]; // 要素を交換
  }
  return arr;
}

// =====================================================
// 年度を選択してクイズを開始する関数
// year: 35〜39 で特定年度、0 で全年度
// =====================================================
function startQuizByYear(year) {
  // 選択した年度を保存（リトライ時に使用）
  selectedYear = year;

  // 年度に応じて問題をフィルタリング
  let filteredQuestions;
  if (year === 0) {
    // 全年度：全問をシャッフル
    filteredQuestions = questions;
  } else {
    // 指定年度の問題のみ抽出
    filteredQuestions = questions.filter(q => q.year === year);
  }

  // 問題をシャッフルして出題順を決める
  shuffledQuestions = shuffleArray(filteredQuestions);

  // 状態をリセット
  currentIndex = 0;
  score = 0;
  streak = 0;
  categoryStats = {};
  answered = false;

  // 年度選択画面を隠して問題画面を表示
  document.getElementById('year-select-screen').style.display = 'none';
  document.getElementById('statsBar').style.display = 'flex';
  document.getElementById('progressContainer').style.display = 'block';
  document.getElementById('questionCard').style.display = 'block';

  // 最初の問題を表示
  showQuestion();
}

// =====================================================
// 問題を表示する関数
// =====================================================
function showQuestion() {
  answered = false;
  const q = shuffledQuestions[currentIndex];

  // カテゴリバッジの設定（カテゴリ名に対応した色クラスを付与）
  const badge = document.getElementById('categoryBadge');
  badge.textContent = q.category;
  badge.className = `category-badge cat-${q.category}`;

  // 問題番号の表示（「問題 1 / 10」のような形式）
  document.getElementById('questionNumber').textContent =
    `問題 ${currentIndex + 1} / ${shuffledQuestions.length}`;

  // 問題文の表示
  document.getElementById('questionText').textContent = q.question;

  // 選択肢の表示（A〜Dのラベル付きボタンを生成）
  const grid = document.getElementById('optionsGrid');
  grid.innerHTML = '';
  const labels = ['A', 'B', 'C', 'D'];
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-letter">${labels[i]}</span><span>${opt}</span>`;
    btn.onclick = () => selectAnswer(i);
    grid.appendChild(btn);
  });

  // 解説と次へボタンを非表示にリセット
  const expBox = document.getElementById('explanationBox');
  expBox.style.display = 'none';
  expBox.className = 'explanation-box';
  document.getElementById('nextBtn').style.display = 'none';

  // カードのアニメーションを再実行（新しい問題のたびにアニメーション）
  const card = document.getElementById('questionCard');
  card.style.animation = 'none';
  card.offsetHeight; // リフロー強制（アニメーションをリセットするためのトリック）
  card.style.animation = 'cardIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';

  // 統計バーとプログレスバーを更新
  updateStats();
  updateProgress();
}

// =====================================================
// 回答選択時の処理
// selectedIndex: ユーザーが選んだ選択肢のインデックス（0〜3）
// =====================================================
function selectAnswer(selectedIndex) {
  if (answered) return; // 既に回答済みなら何もしない
  answered = true;

  const q = shuffledQuestions[currentIndex];
  const buttons = document.querySelectorAll('.option-btn');
  const isCorrect = selectedIndex === q.answer;

  // カテゴリ別統計の更新（初回のカテゴリは初期化）
  if (!categoryStats[q.category]) {
    categoryStats[q.category] = { correct: 0, total: 0 };
  }
  categoryStats[q.category].total++;

  // 全ての選択肢ボタンを無効化（再クリック防止）
  buttons.forEach(btn => btn.disabled = true);

  if (isCorrect) {
    // 正解の場合：スコアと連続正解を更新、正解ボタンを緑にハイライト
    score++;
    streak++;
    categoryStats[q.category].correct++;
    buttons[selectedIndex].classList.add('correct');

    // 3連続以上の正解でポップアップを表示
    if (streak >= 3) {
      showStreakPopup(streak);
    }
  } else {
    // 不正解の場合：連続正解をリセット、選んだボタンを赤・正解ボタンを緑にハイライト
    streak = 0;
    buttons[selectedIndex].classList.add('wrong');
    buttons[q.answer].classList.add('correct'); // 正解の選択肢も表示
  }

  // 解説ボックスを表示（正解・不正解で色が変わる）
  const expBox = document.getElementById('explanationBox');
  expBox.style.display = 'block';
  expBox.className = `explanation-box ${isCorrect ? 'correct-exp' : 'wrong-exp'}`;
  document.getElementById('expIcon').textContent = isCorrect ? '✅' : '❌';
  document.getElementById('expTitle').textContent = isCorrect ? '正解！' : '不正解…';
  document.getElementById('expBody').textContent = q.explanation;

  // 次へボタンを表示（最後の問題なら「結果を見る」に変更）
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.style.display = 'block';
  nextBtn.textContent = currentIndex === shuffledQuestions.length - 1
    ? '結果を見る 🏆'
    : '次の問題へ →';

  // 統計バーをリアルタイム更新
  updateStats();
}

// =====================================================
// 次の問題へ移動する関数
// =====================================================
function nextQuestion() {
  currentIndex++;
  if (currentIndex >= shuffledQuestions.length) {
    showResult(); // 全問終了したら結果画面へ
  } else {
    showQuestion(); // 次の問題を表示
  }
}

// =====================================================
// 統計バーの更新（問題番号・スコア・連続正解）
// =====================================================
function updateStats() {
  document.getElementById('statQuestion').textContent =
    `${currentIndex + 1} / ${shuffledQuestions.length}`;
  document.getElementById('statScore').textContent = score;

  // 連続3以上でゴールドに光るクラスを付与
  const streakEl = document.getElementById('statStreak');
  streakEl.textContent = streak;
  streakEl.className = streak >= 3 ? 'stats-value streak-highlight' : 'stats-value';
}

// =====================================================
// プログレスバーの更新（現在の進捗を%で表示）
// =====================================================
function updateProgress() {
  const pct = (currentIndex / shuffledQuestions.length) * 100;
  document.getElementById('progressBar').style.width = pct + '%';
}

// =====================================================
// 連続正解ポップアップを表示する関数
// count: 現在の連続正解数
// =====================================================
function showStreakPopup(count) {
  const popup = document.getElementById('streakPopup');
  // 連続正解数に応じたメッセージを表示
  const messages = {
    3: '🔥 3連続正解！',
    4: '⚡ 4連続正解！',
    5: '💥 5連続正解！',
    6: '🌟 6連続正解！',
    7: '🚀 7連続正解！！',
    8: '👑 8連続正解！！',
    9: '🎯 9連続正解！！',
    10: '🏆 パーフェクト連続！！'
  };
  popup.textContent = messages[count] || `🔥 ${count}連続正解！！`;
  popup.className = 'streak-popup show';

  // 1.5秒後に消える（フェードアウト）
  setTimeout(() => {
    popup.className = 'streak-popup hide';
    setTimeout(() => { popup.className = 'streak-popup'; }, 300);
  }, 1500);
}

// =====================================================
// 星の数を計算する関数（スコア率に応じて1〜5星）
// =====================================================
function calcStars(correct, total) {
  const rate = correct / total;
  if (rate >= 0.9) return 5;
  if (rate >= 0.75) return 4;
  if (rate >= 0.6) return 3;
  if (rate >= 0.4) return 2;
  return 1;
}

// =====================================================
// 結果画面を表示する関数
// 全問終了後に呼ばれる
// =====================================================
function showResult() {
  // 問題カードと統計バーを非表示にする
  document.getElementById('questionCard').style.display = 'none';
  document.getElementById('statsBar').style.display = 'none';
  document.getElementById('progressContainer').style.display = 'none';

  // 結果画面を表示
  const resultScreen = document.getElementById('resultScreen');
  resultScreen.style.display = 'block';

  const total = shuffledQuestions.length;
  const rate = score / total;

  // スコアに応じて絵文字・タイトル・サブタイトルを変える
  let emoji, title, subtitle;
  if (rate >= 0.9) {
    emoji = '🏆'; title = '素晴らしい！合格レベルです！'; subtitle = '管理栄養士試験に向けて自信を持って！';
  } else if (rate >= 0.75) {
    emoji = '🎉'; title = '優秀です！もう一歩！'; subtitle = '苦手な分野を重点的に復習しましょう。';
  } else if (rate >= 0.6) {
    emoji = '📚'; title = '合格圏内！頑張っています'; subtitle = '引き続き各カテゴリをバランスよく学習しよう。';
  } else if (rate >= 0.4) {
    emoji = '💪'; title = 'もう少し！復習が必要です'; subtitle = '間違えた問題の解説を読み返しましょう。';
  } else {
    emoji = '🌱'; title = 'まだまだこれから！'; subtitle = '基礎からじっくり学習し直しましょう。';
  }

  // 結果画面の各要素に値をセット
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultSubtitle').textContent = subtitle;
  document.getElementById('resultScore').textContent = score;
  document.getElementById('resultTotal').textContent = `/ ${total}`;

  // 星の表示（5段階評価）
  const stars = calcStars(score, total);
  const starsEl = document.getElementById('starsContainer');
  starsEl.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const star = document.createElement('span');
    star.className = 'star';
    star.textContent = i < stars ? '⭐' : '☆';
    starsEl.appendChild(star);
  }

  // カテゴリ別正解率の棒グラフを表示（出題されたカテゴリのみ）
  const breakdownEl = document.getElementById('breakdownItems');
  breakdownEl.innerHTML = '';
  Object.entries(categoryStats).forEach(([cat, stat]) => {
    const pct = Math.round((stat.correct / stat.total) * 100);
    const item = document.createElement('div');
    item.className = 'breakdown-item';
    item.innerHTML = `
      <span class="breakdown-cat">${cat}</span>
      <div class="breakdown-bar-bg">
        <div class="breakdown-bar-fill" style="width:0%" data-pct="${pct}"></div>
      </div>
      <span class="breakdown-pct">${pct}%</span>
    `;
    breakdownEl.appendChild(item);
  });

  // 棒グラフをアニメーションで伸ばす（少し遅延させてから）
  setTimeout(() => {
    document.querySelectorAll('.breakdown-bar-fill').forEach(el => {
      el.style.width = el.dataset.pct + '%';
    });
  }, 400);

  // プログレスバーを100%に
  document.getElementById('progressBar').style.width = '100%';

  // 高スコア（80%以上）で紙吹雪エフェクトを表示
  if (rate >= 0.8) {
    launchConfetti();
  }
}

// =====================================================
// 紙吹雪（コンフェッティ）を生成する関数
// CSSアニメーションのみで実装（外部ライブラリ不要）
// =====================================================
function launchConfetti() {
  const wrapper = document.getElementById('confettiWrapper');
  wrapper.innerHTML = '';

  // 紙吹雪のカラーリスト
  const colors = [
    '#ff6b6b','#ffd93d','#6bcb77','#4d96ff',
    '#ff922b','#cc5de8','#51cf66','#f03e3e',
    '#74c0fc','#ffa94d'
  ];
  const shapes = ['square', 'rect', 'circle'];

  // 80個の紙吹雪ピースを生成
  for (let i = 0; i < 80; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';

    const color = colors[Math.floor(Math.random() * colors.length)];
    const left = Math.random() * 100;          // 水平位置（%）
    const duration = 2.5 + Math.random() * 3; // 落下時間（秒）
    const delay = Math.random() * 2;           // 開始遅延（秒）
    const size = 6 + Math.random() * 10;       // サイズ（px）
    const shape = shapes[Math.floor(Math.random() * shapes.length)];

    piece.style.left = left + '%';
    piece.style.width = size + 'px';
    piece.style.height = shape === 'rect' ? (size * 0.4) + 'px' : size + 'px';
    piece.style.background = color;
    piece.style.borderRadius = shape === 'circle' ? '50%' : '2px';
    piece.style.animationDuration = duration + 's';
    piece.style.animationDelay = delay + 's';

    wrapper.appendChild(piece);
  }

  // 7秒後に紙吹雪を後片付け
  setTimeout(() => {
    wrapper.innerHTML = '';
  }, 7000);
}

// =====================================================
// 同じ年度でもう一度クイズをやり直す関数
// 「もう一度チャレンジ」ボタンから呼ばれる
// =====================================================
function retryCurrentYear() {
  // 紙吹雪を片付ける
  document.getElementById('confettiWrapper').innerHTML = '';

  // 結果画面を隠して、同じ年度でクイズを再開
  document.getElementById('resultScreen').style.display = 'none';

  // 保存していた年度で再スタート
  startQuizByYear(selectedYear);
}

// =====================================================
// 年度選択画面に戻る関数
// 「年度選択に戻る」ボタンから呼ばれる
// =====================================================
function goToYearSelect() {
  // 紙吹雪を片付ける
  document.getElementById('confettiWrapper').innerHTML = '';

  // 結果画面を隠す
  document.getElementById('resultScreen').style.display = 'none';

  // 統計バーとプログレスバーも隠す
  document.getElementById('statsBar').style.display = 'none';
  document.getElementById('progressContainer').style.display = 'none';

  // プログレスバーをリセット
  document.getElementById('progressBar').style.width = '0%';

  // 年度選択画面を再表示
  document.getElementById('year-select-screen').style.display = 'block';
}
